<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>CreditCombo · Card Browser</title>
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg?v=2" />
  <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
  <link rel="shortcut icon" href="/favicon.ico?v=2" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <link rel="mask-icon" href="/safari-pinned-tab.svg?v=2" color="#1e3a8a" />
  <link rel="manifest" href="/icons/site.webmanifest?v=2" />
  <meta name="theme-color" content="#1e3a8a" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="container siteHeader">
    <nav class="topNav" aria-label="Primary">
      <a class="textLink" href="./valuations.html">Rewards valuation guide</a>
      <a class="textLink" href="./index.html">← Home</a>
    </nav>
    <div class="header">
      <div>
        <h1>Card browser</h1>
        <p class="subtle">Explore every modeled card and compare details quickly.</p>
      </div>
    </div>
  </header>

  <main class="container browserLayout">
    <section class="panel browserControls">
      <div class="panelHeader">
        <h2>Filters</h2>
        <button id="resetFiltersBtn" type="button" class="browserResetBtn">Reset filters</button>
      </div>
      <div class="divider"></div>
      <div class="browserFilterGrid">
        <div class="field">
          <label for="searchInput">Search cards</label>
          <input id="searchInput" type="search" placeholder="Card name, issuer, network..." />
        </div>
        <div class="field">
          <label for="issuerFilter">Issuer</label>
          <select id="issuerFilter"></select>
        </div>
        <div class="field">
          <label for="programFilter">Rewards program</label>
          <select id="programFilter"></select>
        </div>
        <div class="field">
          <label for="sortBy">Sort by</label>
          <select id="sortBy">
            <option value="name">Card name (A–Z)</option>
            <option value="annualFeeAsc">Annual fee (low to high)</option>
            <option value="annualFeeDesc">Annual fee (high to low)</option>
            <option value="issuer">Issuer (A–Z)</option>
          </select>
        </div>
      </div>
      <p id="browserSummary" class="subtle"></p>
    </section>

    <section id="cardsList" class="browserCards"></section>
    <section id="browserFatal" class="panel hidden"></section>
  </main>

  <script type="module" src="./src/card-browser.js"></script>
</body>
</html>
