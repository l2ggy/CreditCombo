  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=6" />
  <link rel="mask-icon" href="/icons/safari-pinned-tab.svg?v=6" color="#1e3a8a" />
  <link rel="manifest" href="/icons/site.webmanifest?v=6" />
  <meta name="theme-color" content="#1e3a8a" />
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/browser.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body>
  <header class="container siteHeader">
    <nav class="topNav" aria-label="Primary">
      <span class="siteBrand">CreditCombo</span>
      <div class="topNavLinks">
        <a class="textLink" href="./index.html">Optimizer</a>
        <a class="textLink" href="./cards.html" aria-current="page">Browse all cards</a>
        <a class="textLink" href="./valuations.html">Rewards valuation guide</a>
        <a class="textLink" href="./about.html">About</a>
      </div>
      <div id="auth-controls" class="authControls" aria-live="polite"></div>
      <button type="button" class="themeToggle" data-theme-toggle aria-label="Switch theme" title="Switch theme">☀︎</button>
    </nav>
    <div class="divider" aria-hidden="true"></div>
    <h1 class="pageTitle">Card Browser</h1>
    <div class="header">
      <div>
        <p class="subtle">Explore every modeled card and compare details quickly.</p>
      </div>
    </div>
  </header>

  <main class="container pageStack">
    <section class="panel">
      <div class="panelHeader">
        <h2>Filters</h2>
        <button id="resetFiltersBtn" type="button" class="btn-inline">Reset filters</button>
      </div>
      <div class="divider"></div>
      <div class="fieldGrid">
        <div>
          <label for="searchInput">Search cards</label>
          <input id="searchInput" type="search" placeholder="Card name, issuer, network..." />
        </div>
        <div>
          <label for="issuerFilter">Issuer</label>
          <select id="issuerFilter"></select>
        </div>
        <div>
          <label for="programFilter">Rewards program</label>
          <select id="programFilter"></select>
        </div>
        <div>
          <label for="sortBy">Sort by</label>
          <select id="sortBy">
            <option value="name">Card name (A–Z)</option>
            <option value="annualFeeAsc">Annual fee (low to high)</option>
            <option value="annualFeeDesc">Annual fee (high to low)</option>
            <option value="issuer">Issuer (A–Z)</option>
            <option value="earnRateCategoryDesc">Category earn rate (high to low)</option>
          </select>
        </div>
        <div id="sortEarnCategoryField" hidden>
          <label for="sortEarnCategory">Sort earn category</label>
          <select id="sortEarnCategory" disabled>
            <option value="">Select category</option>
          </select>
        </div>
      </div>
      <p id="browserSummary" class="subtle"></p>
    </section>

    <section id="cardsList" class="cardList"></section>
    <section id="browserFatal" class="panel hidden"></section>
  </main>

  <script type="module" src="./src/card-browser.js"></script>
</body>
</html>
