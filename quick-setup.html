<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quick setup · CreditCombo</title>
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/quick-setup.css" />
  <script type="module" src="./src/theme.js"></script>
</head>
<body>
  <header class="container siteHeader">
    <nav class="topNav" aria-label="Primary">
      <span class="siteBrand">CreditCombo</span>
      <div class="topNavLinks">
        <a class="textLink" href="./index.html">← Back to main page</a>
      </div>
      <button type="button" class="themeToggle" data-theme-toggle>☀︎</button>
    </nav>
  </header>

  <main class="container quickSetup" id="quickSetupApp">
    <div class="progressWrap" aria-label="Progress">
      <div class="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Quick setup progress"><span id="progressFill"></span></div>
      <p id="progressText" class="subtle">0% complete</p>
    </div>

    <section class="panel stepPanel" id="stepPanel"></section>

    <div class="wizardActions">
      <button type="button" id="backBtn">Back</button>
      <button type="button" id="nextBtn" class="primary">Next</button>
    </div>

  </main>

  <script type="module" src="./src/quick-setup.js"></script>
</body>
</html>
